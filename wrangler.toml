name = "discord-status-role"
main = "src/index.js"
compatibility_date = "2026-11-01"

# 公開しても困らない設定値はここに書く（トークン類は secret で設定すること）
[vars]
USER_ID = "856120799639633940"
ROLES = '{"sleep":"1043500522977632368:1568190166928195634,1347733971877888120:1568199240402866306","away":"1043500522977632368:1568190283756339260,1347733971877888120:1568199387270610985","work":"1347733971877888120:1568204849072578560","busy":"1347733971877888120:1568205068153393182"}'
# busy は時刻指定がなければ翌朝 5:00（日本時間）に自動で外す
AUTO_OFF = '{"busy":"05:00"}'

# 自動オフの予約を保存する KV
[[kv_namespaces]]
binding = "STATE"
id = "8abb0dbacbba4a29a706ea98fc7b7126"

# 5分おきに期限切れのロールを外す
[triggers]
crons = ["*/5 * * * *"]
